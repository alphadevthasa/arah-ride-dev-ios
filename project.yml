name: ArahRide
options:
  bundleIdPrefix: id.arahride
  deploymentTarget:
    iOS: "16.0"
packages:
  MapLibreNative:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 6.28.0
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""
targets:
  ArahCustomer:
    type: application
    platform: iOS
    sources: [Shared, Customer]
    dependencies:
      - package: MapLibreNative
        product: MapLibre
    info:
      path: Customer/Info.plist
      properties:
        CFBundleDisplayName: Arah
        UILaunchScreen: {}
        ArahAPIBaseURL: http://127.0.0.1:18080
        ArahMapStyleURL: https://tiles.openfreemap.org/styles/liberty
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.arahride.customer
  ArahDriver:
    type: application
    platform: iOS
    sources: [Shared, Driver]
    dependencies:
      - package: MapLibreNative
        product: MapLibre
    info:
      path: Driver/Info.plist
      properties:
        CFBundleDisplayName: Arah Driver
        UILaunchScreen: {}
        ArahAPIBaseURL: http://127.0.0.1:18080
        ArahMapStyleURL: https://tiles.openfreemap.org/styles/liberty
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocationWhenInUseUsageDescription: Lokasi dibagikan kepada Customer saat Driver online.
        UIBackgroundModes:
          - location
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.arahride.driver
